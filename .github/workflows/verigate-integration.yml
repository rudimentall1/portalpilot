name: Verigate integration typecheck

on:
  push:
    branches:
      - integration/verigate-authorization-gate
  pull_request:
    branches:
      - main

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run test:verigate
      - run: npm --prefix app ci
      - run: npm --prefix app run build
